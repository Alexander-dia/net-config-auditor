hostname Core-Switch-01
!
service password-encryption
!
ip domain-name company.local
ip ssh version 2
no ip http server
ip http secure-server
!
banner motd ^C Authorized Access Only! All activity monitored. ^C
!
interface GigabitEthernet0/1
 description Uplink to Firewall
 switchport mode trunk
!
line con 0
 exec-timeout 5 0
line vty 0 4
 access-class 10 in
 exec-timeout 5 0
 transport input ssh
!
end